# MyST project configuration
# Docs: https://mystmd.org/guide/configuration
version: 1
project:
  title: "Mind the Machine"
  subtitle: "Understanding, Applying, and Questioning Artificial Intelligence"
  authors:
    - name: Professor Carlos Marquez
      affiliations:
        - Miami Dade College
  description: |
    A demystifying, hands-on introduction to artificial intelligence for
    CAI1001C at Miami Dade College. Students cut through the AI hype, learn how
    core AI technologies actually work, apply current AI tools to real problems
    of their own choosing, and reflect on the ethics of what they build.
    Designed for a mixed, open-enrollment audience — no programming experience
    required.
  keywords:
    - Artificial Intelligence
    - Machine Learning
    - AI Literacy
    - Generative AI
    - Gemini
    - NotebookLM
    - Computer Vision
    - Natural Language Processing
    - AI Ethics
    - CAI1001C
  license: CC-BY-4.0
  open_access: true
  github: https://github.com/c-marq/cai1001c-ai-thinking
  edit_url: null
  # Numbering — headings, figures and diagrams are numbered manually in the
  # text (the book uses separate "Figure X.Y" and "Diagram X.Y" sequences),
  # so MyST auto-numbering is turned off to avoid double numbering.
  numbering:
    heading_1: false
    heading_2: false
    heading_3: false
    figure: false
    table: false
    equation: false
  # PDF export
  exports:
    - format: pdf
  # Table of contents
  toc:
    - file: index.md
    - title: Front Matter
      children:
        - file: front-matter/dedication.md
        - file: front-matter/foreword.md
        - file: front-matter/how-to-use.md
    - title: Chapters
      children:
        - file: chapters/ch01-age-of-ai.md
        - file: chapters/ch02-digital-literacy-data.md
        - file: chapters/ch03-working-with-data.md
        - file: chapters/ch04-machine-learning.md
        - file: chapters/ch05-computer-vision.md
        - file: chapters/ch06-language-conversation.md
        - file: chapters/ch07-generative-media.md
        - file: chapters/ch08-ai-real-world.md
    - title: Course Sessions
      children:
        - file: sessions/session03.md
    - title: Addenda
      children:
        - file: addenda/addendum-a-course-map.md
        - file: addenda/addendum-b-glossary.md
        - file: addenda/addendum-c-grading.md
        - file: addenda/addendum-d-academic-integrity.md
        - file: addenda/addendum-e-tool-reference.md

site:
  title: "Mind the Machine"
  options:
    logo_text: "Mind the Machine"
    logo_url: "/cai1001c-ai-thinking/"

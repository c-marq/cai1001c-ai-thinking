# Auto-generated by OpenClaw book-writer
# Deploys MyST book to GitHub Pages on every push to main

name: MyST GitHub Pages Deploy
on:
  push:
    branches: [main]
env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build HTML Assets
        run: myst build --html
      # MyST only builds the pages registered in myst.yml. The standalone
      # HTML worksheets (guided demos, group labs, homeworks) are not MyST
      # pages, so they must be copied into the build output by hand or they
      # will never reach the deployed site.
      - name: Copy standalone HTML worksheets into the build
        run: cp -r guided-demos group-labs homeworks _build/html/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
